<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Snake</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #141923;
        --border: #252d3b;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #f97316;
        --accent-ink: #0b0d11;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .hud {
        width: 100%;
        max-width: 460px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .stats {
        display: flex;
        gap: 18px;
        font-variant-numeric: tabular-nums;
      }
      .stat-label { font-size: 11px; color: var(--muted); display: block; }
      .stat-val { font-size: 18px; font-weight: 700; }
      .hud-actions { display: flex; gap: 8px; }
      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #1c2330;
        color: var(--text);
        cursor: pointer;
      }
      button:hover { border-color: #4b5563; }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      button.active-opt {
        border-color: var(--accent);
        color: var(--accent);
      }
      .board-wrap {
        position: relative;
        width: min(460px, 92vw);
        aspect-ratio: 1 / 1;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(11, 14, 20, 0.88);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 24px; }
      .overlay p { margin: 0; font-size: 14px; color: var(--muted); max-width: 30ch; }
      .option-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
      .dpad {
        display: none;
        grid-template-columns: repeat(3, 48px);
        gap: 6px;
      }
      @media (pointer: coarse), (max-width: 560px) {
        .dpad { display: grid; }
      }
      .dpad button { height: 44px; padding: 0; font-size: 16px; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="stats">
        <div><span class="stat-label">Score</span><span class="stat-val" id="score-el">0</span></div>
        <div><span class="stat-label">Best</span><span class="stat-val" id="best-el">0</span></div>
      </div>
      <div class="hud-actions">
        <button type="button" id="pause-btn" disabled>Pause</button>
        <button type="button" id="mute-btn">Sound: On</button>
      </div>
    </div>

    <div class="board-wrap">
      <canvas id="game" width="420" height="420"></canvas>

      <div class="overlay" id="menu-overlay">
        <h1 id="overlay-title">Grid Snake</h1>
        <p id="overlay-sub">Use Arrow keys or WASD to steer. Collect coral fruit without crashing.</p>
        <div class="option-row" aria-label="Speed">
          <button type="button" class="speed-opt" data-speed="135">Chill</button>
          <button type="button" class="speed-opt active-opt" data-speed="95">Normal</button>
          <button type="button" class="speed-opt" data-speed="65">Turbo</button>
        </div>
        <div class="option-row" aria-label="Walls">
          <button type="button" class="wall-opt active-opt" data-wrap="false">Solid Walls</button>
          <button type="button" class="wall-opt" data-wrap="true">Wrap Borders</button>
        </div>
        <button type="button" class="primary" id="start-btn">Start Game</button>
      </div>
    </div>

    <div class="dpad" aria-label="Touch controls">
      <span></span>
      <button type="button" data-dir="0,-1" aria-label="Up">▲</button>
      <span></span>
      <button type="button" data-dir="-1,0" aria-label="Left">◀</button>
      <button type="button" data-dir="0,1" aria-label="Down">▼</button>
      <button type="button" data-dir="1,0" aria-label="Right">▶</button>
    </div>

    <script>
      const GRID = 20;
      const CELL = 21;
      const BEST_KEY = 'arcadevault_snake_best';
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score-el');
      const bestEl = document.getElementById('best-el');
      const overlay = document.getElementById('menu-overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlaySub = document.getElementById('overlay-sub');
      const startBtn = document.getElementById('start-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const muteBtn = document.getElementById('mute-btn');

      let snake = [];
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let food = { x: 14, y: 10 };
      let score = 0;
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      let tickMs = 95;
      let wrapWalls = false;
      let state = 'MENU';
      let timerId = null;
      let muted = false;
      let audioCtx = null;

      bestEl.textContent = best;

      function beep(freq, dur, type = 'sine') {
        if (muted) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      function spawnFood() {
        const occupied = new Set(snake.map((s) => `${s.x},${s.y}`));
        const free = [];
        for (let y = 0; y < GRID; y++) {
          for (let x = 0; x < GRID; x++) {
            if (!occupied.has(`${x},${y}`)) free.push({ x, y });
          }
        }
        food = free.length ? free[Math.floor(Math.random() * free.length)] : { x: 0, y: 0 };
      }

      function startGame() {
        clearInterval(timerId);
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        scoreEl.textContent = '0';
        spawnFood();
        state = 'PLAYING';
        overlay.hidden = true;
        pauseBtn.disabled = false;
        pauseBtn.textContent = 'Pause';
        draw();
        timerId = setInterval(step, tickMs);
      }

      function togglePause() {
        if (state === 'PLAYING') {
          state = 'PAUSED';
          clearInterval(timerId);
          pauseBtn.textContent = 'Resume';
          overlayTitle.textContent = 'Paused';
          overlaySub.textContent = 'Press Space or click Resume to continue.';
          startBtn.textContent = 'Restart';
          overlay.hidden = false;
        } else if (state === 'PAUSED') {
          state = 'PLAYING';
          overlay.hidden = true;
          pauseBtn.textContent = 'Pause';
          timerId = setInterval(step, tickMs);
        }
      }

      function endGame() {
        state = 'OVER';
        clearInterval(timerId);
        pauseBtn.disabled = true;
        beep(170, 0.25, 'sawtooth');
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem(BEST_KEY, String(best));
        }
        overlayTitle.textContent = 'Game Over';
        overlaySub.textContent = `Final score: ${score} · Best: ${best}`;
        startBtn.textContent = 'Play Again';
        overlay.hidden = false;
      }

      function step() {
        dir = nextDir;
        let nx = snake[0].x + dir.x;
        let ny = snake[0].y + dir.y;

        if (wrapWalls) {
          nx = (nx + GRID) % GRID;
          ny = (ny + GRID) % GRID;
        } else if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) {
          endGame();
          return;
        }

        const willEat = nx === food.x && ny === food.y;
        const bodyToCheck = willEat ? snake : snake.slice(0, -1);
        if (bodyToCheck.some((seg) => seg.x === nx && seg.y === ny)) {
          endGame();
          return;
        }

        snake.unshift({ x: nx, y: ny });
        if (willEat) {
          score += 10;
          scoreEl.textContent = String(score);
          beep(520, 0.09, 'triangle');
          spawnFood();
        } else {
          snake.pop();
        }
        draw();
      }

      function draw() {
        ctx.fillStyle = '#111620';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#1a2130';
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0);
          ctx.lineTo(i * CELL, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * CELL);
          ctx.lineTo(canvas.width, i * CELL);
          ctx.stroke();
        }

        // Fruit
        ctx.fillStyle = '#fb7185';
        ctx.beginPath();
        ctx.roundRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 5);
        ctx.fill();

        // Snake segments
        snake.forEach((seg, idx) => {
          ctx.fillStyle = idx === 0 ? '#fb923c' : '#f97316';
          ctx.beginPath();
          ctx.roundRect(seg.x * CELL + 1.5, seg.y * CELL + 1.5, CELL - 3, CELL - 3, 5);
          ctx.fill();
        });
      }

      function queueDir(dx, dy) {
        if (dx === -dir.x && dy === -dir.y) return;
        nextDir = { x: dx, y: dy };
      }

      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) {
          e.preventDefault();
        }
        if (key === ' ' || key === 'p') {
          if (state === 'PLAYING' || state === 'PAUSED') togglePause();
          else if (state === 'MENU' || state === 'OVER') startGame();
          return;
        }
        if (state !== 'PLAYING') return;
        if (key === 'arrowup' || key === 'w') queueDir(0, -1);
        else if (key === 'arrowdown' || key === 's') queueDir(0, 1);
        else if (key === 'arrowleft' || key === 'a') queueDir(-1, 0);
        else if (key === 'arrowright' || key === 'd') queueDir(1, 0);
      });

      document.querySelectorAll('.speed-opt').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.speed-opt').forEach((b) => b.classList.remove('active-opt'));
          btn.classList.add('active-opt');
          tickMs = Number(btn.dataset.speed);
        });
      });

      document.querySelectorAll('.wall-opt').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.wall-opt').forEach((b) => b.classList.remove('active-opt'));
          btn.classList.add('active-opt');
          wrapWalls = btn.dataset.wrap === 'true';
        });
      });

      document.querySelectorAll('[data-dir]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state !== 'PLAYING') return;
          const [dx, dy] = btn.dataset.dir.split(',').map(Number);
          queueDir(dx, dy);
        });
      });

      startBtn.addEventListener('click', startGame);
      pauseBtn.addEventListener('click', togglePause);
      muteBtn.addEventListener('click', () => {
        muted = !muted;
        muteBtn.textContent = muted ? 'Sound: Off' : 'Sound: On';
      });

      draw();
    </script>
  </body>
</html>
