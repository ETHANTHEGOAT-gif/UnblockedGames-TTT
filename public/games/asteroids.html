<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meteor Blaster</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --panel: #141923;
        --border: #252d3b;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #f97316;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .hud {
        width: min(680px, 95vw);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-variant-numeric: tabular-nums;
      }
      .stats { display: flex; gap: 20px; }
      .stat-label { display: block; font-size: 11px; color: var(--muted); }
      .stat-val { font-size: 17px; font-weight: 700; }
      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #1c2330;
        color: var(--text);
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d11; }
      .stage {
        position: relative;
        width: min(680px, 95vw);
        aspect-ratio: 16 / 10;
        background: #0b0e15;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      canvas { display: block; width: 100%; height: 100%; }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(9, 11, 16, 0.86);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 20px;
        text-align: center;
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 24px; }
      .overlay p { margin: 0; font-size: 14px; color: var(--muted); max-width: 36ch; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="stats">
        <div><span class="stat-label">Score</span><span class="stat-val" id="score-el">0</span></div>
        <div><span class="stat-label">Wave</span><span class="stat-val" id="wave-el">1</span></div>
        <div><span class="stat-label">Lives</span><span class="stat-val" id="lives-el">3</span></div>
      </div>
      <button type="button" id="mute-btn">Sound: On</button>
    </div>

    <div class="stage">
      <canvas id="canvas" width="680" height="425"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="overlay-title">Meteor Blaster</h1>
        <p id="overlay-sub">Rotate with A/D or Left/Right, thrust with W or Up, fire with Space.</p>
        <button type="button" class="primary" id="start-btn">Start Mission</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score-el');
      const waveEl = document.getElementById('wave-el');
      const livesEl = document.getElementById('lives-el');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlaySub = document.getElementById('overlay-sub');
      const startBtn = document.getElementById('start-btn');
      const muteBtn = document.getElementById('mute-btn');

      let state = 'MENU';
      let score = 0;
      let wave = 1;
      let lives = 3;
      let ship = null;
      let bullets = [];
      let asteroids = [];
      let sparks = [];
      let keys = {};
      let fireCooldown = 0;
      let muted = false;
      let audioCtx = null;

      function beep(freq, dur, type = 'sawtooth') {
        if (muted) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      function createAsteroid(x, y, radius) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (1.1 + Math.random() * 1.4) * (radius < 20 ? 1.4 : 1);
        const verts = [];
        const points = 9;
        for (let i = 0; i < points; i++) {
          const a = (i / points) * Math.PI * 2;
          const r = radius * (0.76 + Math.random() * 0.36);
          verts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
        }
        return { x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius, verts };
      }

      function spawnWave(count) {
        asteroids = [];
        for (let i = 0; i < count; i++) {
          let x, y;
          do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
          } while (Math.hypot(x - canvas.width / 2, y - canvas.height / 2) < 120);
          asteroids.push(createAsteroid(x, y, 36));
        }
      }

      function resetShip() {
        ship = { x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, angle: -Math.PI / 2, invuln: 110 };
      }

      function syncHud() {
        scoreEl.textContent = String(score);
        waveEl.textContent = String(wave);
        livesEl.textContent = String(lives);
      }

      function startGame() {
        score = 0;
        wave = 1;
        lives = 3;
        bullets = [];
        sparks = [];
        resetShip();
        spawnWave(4);
        syncHud();
        state = 'PLAYING';
        overlay.hidden = true;
      }

      function wrap(obj) {
        if (obj.x < -40) obj.x = canvas.width + 40;
        if (obj.x > canvas.width + 40) obj.x = -40;
        if (obj.y < -40) obj.y = canvas.height + 40;
        if (obj.y > canvas.height + 40) obj.y = -40;
      }

      function addSparks(x, y, color, count = 8) {
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 1 + Math.random() * 2.5;
          sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 22, color });
        }
      }

      function loop() {
        if (state === 'PLAYING') {
          if (keys['arrowleft'] || keys['a']) ship.angle -= 0.065;
          if (keys['arrowright'] || keys['d']) ship.angle += 0.065;
          if (keys['arrowup'] || keys['w']) {
            ship.vx += Math.cos(ship.angle) * 0.16;
            ship.vy += Math.sin(ship.angle) * 0.16;
          }
          ship.vx *= 0.99;
          ship.vy *= 0.99;
          ship.x += ship.vx;
          ship.y += ship.vy;
          wrap(ship);
          if (ship.invuln > 0) ship.invuln--;

          if (fireCooldown > 0) fireCooldown--;
          if (keys[' '] && fireCooldown === 0) {
            bullets.push({
              x: ship.x + Math.cos(ship.angle) * 14,
              y: ship.y + Math.sin(ship.angle) * 14,
              vx: Math.cos(ship.angle) * 7.5 + ship.vx * 0.4,
              vy: Math.sin(ship.angle) * 7.5 + ship.vy * 0.4,
              life: 55,
            });
            fireCooldown = 12;
            beep(660, 0.06, 'square');
          }

          for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            wrap(b);
            b.life--;
            if (b.life <= 0) bullets.splice(i, 1);
          }

          for (let i = asteroids.length - 1; i >= 0; i--) {
            const a = asteroids[i];
            a.x += a.vx;
            a.y += a.vy;
            wrap(a);

            // Bullet hit
            let destroyed = false;
            for (let j = bullets.length - 1; j >= 0; j--) {
              const b = bullets[j];
              if (Math.hypot(b.x - a.x, b.y - a.y) < a.radius) {
                bullets.splice(j, 1);
                asteroids.splice(i, 1);
                destroyed = true;
                score += a.radius > 26 ? 25 : a.radius > 16 ? 50 : 100;
                syncHud();
                beep(220, 0.12, 'triangle');
                addSparks(a.x, a.y, '#f97316', 10);
                if (a.radius > 16) {
                  asteroids.push(createAsteroid(a.x, a.y, a.radius * 0.56));
                  asteroids.push(createAsteroid(a.x, a.y, a.radius * 0.56));
                }
                break;
              }
            }
            if (destroyed) continue;

            // Ship hit
            if (ship.invuln === 0 && Math.hypot(ship.x - a.x, ship.y - a.y) < a.radius + 10) {
              lives -= 1;
              syncHud();
              beep(130, 0.25, 'sawtooth');
              addSparks(ship.x, ship.y, '#f3f4f6', 14);
              if (lives <= 0) {
                state = 'OVER';
                overlayTitle.textContent = 'Ship Destroyed';
                overlaySub.textContent = `Final score: ${score} · Reached Wave ${wave}`;
                startBtn.textContent = 'Play Again';
                overlay.hidden = false;
              } else {
                resetShip();
              }
            }
          }

          if (asteroids.length === 0 && state === 'PLAYING') {
            wave += 1;
            syncHud();
            spawnWave(3 + wave);
            ship.invuln = 80;
          }
        }

        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i];
          s.x += s.vx;
          s.y += s.vy;
          s.life--;
          if (s.life <= 0) sparks.splice(i, 1);
        }

        draw();
        requestAnimationFrame(loop);
      }

      function draw() {
        ctx.fillStyle = '#090b10';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Asteroids
        ctx.strokeStyle = '#9ca3af';
        ctx.fillStyle = '#181f2c';
        ctx.lineWidth = 2;
        asteroids.forEach((a) => {
          ctx.beginPath();
          a.verts.forEach((v, idx) => {
            if (idx === 0) ctx.moveTo(a.x + v.x, a.y + v.y);
            else ctx.lineTo(a.x + v.x, a.y + v.y);
          });
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        });

        // Bullets
        ctx.fillStyle = '#f97316';
        bullets.forEach((b) => {
          ctx.beginPath();
          ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
          ctx.fill();
        });

        // Sparks
        sparks.forEach((s) => {
          ctx.fillStyle = s.color;
          ctx.globalAlpha = s.life / 22;
          ctx.fillRect(s.x, s.y, 3, 3);
          ctx.globalAlpha = 1;
        });

        // Ship
        if (ship && (ship.invuln === 0 || Math.floor(ship.invuln / 6) % 2 === 0)) {
          ctx.save();
          ctx.translate(ship.x, ship.y);
          ctx.rotate(ship.angle);
          if (keys['arrowup'] || keys['w']) {
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(-10, -4);
            ctx.lineTo(-19, 0);
            ctx.lineTo(-10, 4);
            ctx.closePath();
            ctx.fill();
          }
          ctx.strokeStyle = '#f3f4f6';
          ctx.fillStyle = '#1f2937';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(15, 0);
          ctx.lineTo(-11, -9);
          ctx.lineTo(-7, 0);
          ctx.lineTo(-11, 9);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      }

      document.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
        keys[k] = true;
        if (k === ' ' && state !== 'PLAYING') startGame();
      });
      document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
      });

      startBtn.addEventListener('click', startGame);
      muteBtn.addEventListener('click', () => {
        muted = !muted;
        muteBtn.textContent = muted ? 'Sound: Off' : 'Sound: On';
      });

      resetShip();
      spawnWave(4);
      loop();
    </script>
  </body>
</html>
