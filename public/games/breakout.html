<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick Breaker</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #141923;
        --border: #252d3b;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #f97316;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .hud {
        width: min(640px, 95vw);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-variant-numeric: tabular-nums;
      }
      .stats { display: flex; gap: 20px; }
      .stat-label { display: block; font-size: 11px; color: var(--muted); }
      .stat-val { font-size: 17px; font-weight: 700; }
      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #1c2330;
        color: var(--text);
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d11; }
      .stage-wrap {
        position: relative;
        width: min(640px, 95vw);
        aspect-ratio: 4 / 3;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      canvas { display: block; width: 100%; height: 100%; }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(11, 14, 20, 0.86);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 20px;
        text-align: center;
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 24px; }
      .overlay p { margin: 0; font-size: 14px; color: var(--muted); max-width: 34ch; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="stats">
        <div><span class="stat-label">Score</span><span class="stat-val" id="score-el">0</span></div>
        <div><span class="stat-label">Level</span><span class="stat-val" id="level-el">1</span></div>
        <div><span class="stat-label">Lives</span><span class="stat-val" id="lives-el">3</span></div>
      </div>
      <div>
        <button type="button" id="mute-btn">Sound: On</button>
      </div>
    </div>

    <div class="stage-wrap">
      <canvas id="canvas" width="640" height="480"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="overlay-title">Brick Breaker</h1>
        <p id="overlay-sub">Move with mouse or Left/Right arrows. Press Space or click to launch the ball.</p>
        <button type="button" class="primary" id="start-btn">Start Game</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score-el');
      const levelEl = document.getElementById('level-el');
      const livesEl = document.getElementById('lives-el');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlaySub = document.getElementById('overlay-sub');
      const startBtn = document.getElementById('start-btn');
      const muteBtn = document.getElementById('mute-btn');

      const COLORS = ['#ea580c', '#f97316', '#fbbf24', '#f3f4f6', '#94a3b8'];
      let state = 'MENU';
      let score = 0;
      let level = 1;
      let lives = 3;
      let paddle = { x: 270, w: 104, h: 12 };
      let balls = [];
      let bricks = [];
      let drops = [];
      let keys = { left: false, right: false };
      let muted = false;
      let audioCtx = null;
      let rafId = null;

      function beep(freq, dur) {
        if (muted) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      function buildBricks(lvl) {
        bricks = [];
        const cols = 9;
        const rows = 5 + Math.min(2, lvl - 1);
        const pad = 8;
        const marginX = 32;
        const bw = (canvas.width - marginX * 2 - pad * (cols - 1)) / cols;
        const bh = 20;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (lvl % 2 === 0 && (r + c) % 5 === 0) continue;
            bricks.push({
              x: marginX + c * (bw + pad),
              y: 52 + r * (bh + pad),
              w: bw,
              h: bh,
              color: COLORS[r % COLORS.length],
              alive: true,
            });
          }
        }
      }

      function resetBall() {
        paddle.w = 104;
        balls = [{ x: paddle.x + paddle.w / 2, y: canvas.height - 42, dx: 3.4, dy: -4.2, r: 7, stuck: true }];
      }

      function startGame() {
        score = 0;
        level = 1;
        lives = 3;
        drops = [];
        paddle.x = (canvas.width - 104) / 2;
        buildBricks(level);
        resetBall();
        syncHud();
        state = 'PLAYING';
        overlay.hidden = true;
      }

      function syncHud() {
        scoreEl.textContent = String(score);
        levelEl.textContent = String(level);
        livesEl.textContent = String(lives);
      }

      function launchStuckBalls() {
        balls.forEach((b) => {
          if (b.stuck) {
            b.stuck = false;
            const speed = 5 + Math.min(2.2, (level - 1) * 0.4);
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.45;
            b.dx = Math.cos(angle) * speed;
            b.dy = Math.sin(angle) * speed;
          }
        });
      }

      function update() {
        if (state === 'PLAYING') {
          if (keys.left) paddle.x -= 7;
          if (keys.right) paddle.x += 7;
          paddle.x = Math.max(10, Math.min(canvas.width - paddle.w - 10, paddle.x));

          for (let i = balls.length - 1; i >= 0; i--) {
            const b = balls[i];
            if (b.stuck) {
              b.x = paddle.x + paddle.w / 2;
              b.y = canvas.height - 34;
              continue;
            }
            b.x += b.dx;
            b.y += b.dy;

            if (b.x - b.r < 0) { b.x = b.r; b.dx = Math.abs(b.dx); beep(320, 0.04); }
            if (b.x + b.r > canvas.width) { b.x = canvas.width - b.r; b.dx = -Math.abs(b.dx); beep(320, 0.04); }
            if (b.y - b.r < 0) { b.y = b.r; b.dy = Math.abs(b.dy); beep(320, 0.04); }

            // Paddle bounce
            const py = canvas.height - 26;
            if (b.dy > 0 && b.y + b.r >= py && b.y - b.r <= py + paddle.h && b.x >= paddle.x - 4 && b.x <= paddle.x + paddle.w + 4) {
              const hitPos = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
              const speed = Math.hypot(b.dx, b.dy);
              const angle = hitPos * (Math.PI / 3);
              b.dx = Math.sin(angle) * speed;
              b.dy = -Math.cos(angle) * speed;
              b.y = py - b.r;
              beep(440, 0.05);
            }

            // Brick collision
            for (const br of bricks) {
              if (!br.alive) continue;
              if (b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
                br.alive = false;
                b.dy = -b.dy;
                score += 20;
                syncHud();
                beep(580, 0.06);
                if (Math.random() < 0.14) {
                  drops.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, type: Math.random() < 0.5 ? 'W' : 'M' });
                }
                break;
              }
            }

            if (b.y - b.r > canvas.height) {
              balls.splice(i, 1);
            }
          }

          // Power-up drops
          for (let i = drops.length - 1; i >= 0; i--) {
            const d = drops[i];
            d.y += 2.6;
            const py = canvas.height - 26;
            if (d.y + 10 >= py && d.y - 10 <= py + paddle.h && d.x >= paddle.x && d.x <= paddle.x + paddle.w) {
              if (d.type === 'W') {
                paddle.w = Math.min(160, paddle.w + 26);
              } else if (balls.length < 4 && balls[0]) {
                balls.push({ ...balls[0], dx: -balls[0].dx, stuck: false });
              }
              beep(720, 0.1);
              drops.splice(i, 1);
              continue;
            }
            if (d.y > canvas.height + 20) drops.splice(i, 1);
          }

          if (balls.length === 0) {
            lives -= 1;
            syncHud();
            beep(180, 0.2);
            if (lives <= 0) {
              state = 'OVER';
              overlayTitle.textContent = 'Game Over';
              overlaySub.textContent = `Final score: ${score} · Reached Level ${level}`;
              startBtn.textContent = 'Play Again';
              overlay.hidden = false;
            } else {
              resetBall();
            }
          } else if (bricks.every((br) => !br.alive)) {
            level += 1;
            syncHud();
            drops = [];
            buildBricks(level);
            resetBall();
            beep(820, 0.18);
          }
        }

        draw();
        rafId = requestAnimationFrame(update);
      }

      function draw() {
        ctx.fillStyle = '#0e131c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        bricks.forEach((br) => {
          if (!br.alive) return;
          ctx.fillStyle = br.color;
          ctx.beginPath();
          ctx.roundRect(br.x, br.y, br.w, br.h, 4);
          ctx.fill();
        });

        drops.forEach((d) => {
          ctx.fillStyle = d.type === 'W' ? '#10b981' : '#fbbf24';
          ctx.beginPath();
          ctx.roundRect(d.x - 12, d.y - 9, 24, 18, 5);
          ctx.fill();
          ctx.fillStyle = '#0b0d11';
          ctx.font = 'bold 11px system-ui';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(d.type, d.x, d.y + 0.5);
        });

        // Paddle
        ctx.fillStyle = '#e5e7eb';
        ctx.beginPath();
        ctx.roundRect(paddle.x, canvas.height - 26, paddle.w, paddle.h, 6);
        ctx.fill();

        // Balls
        balls.forEach((b) => {
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      canvas.addEventListener('pointermove', (e) => {
        if (state !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const mx = (e.clientX - rect.left) * scaleX;
        paddle.x = Math.max(10, Math.min(canvas.width - paddle.w - 10, mx - paddle.w / 2));
      });

      canvas.addEventListener('click', () => {
        if (state === 'PLAYING') launchStuckBalls();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') { e.preventDefault(); keys.left = true; }
        if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') { e.preventDefault(); keys.right = true; }
        if (e.key === ' ') {
          e.preventDefault();
          if (state === 'PLAYING') launchStuckBalls();
          else startGame();
        }
      });

      document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
      });

      startBtn.addEventListener('click', startGame);
      muteBtn.addEventListener('click', () => {
        muted = !muted;
        muteBtn.textContent = muted ? 'Sound: Off' : 'Sound: On';
      });

      buildBricks(1);
      resetBall();
      rafId = requestAnimationFrame(update);
    </script>
  </body>
</html>
