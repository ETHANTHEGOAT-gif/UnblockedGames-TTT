<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Four in a Row</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #141923;
        --border: #252d3b;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --p1: #f97316;
        --p2: #f3f4f6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .hud {
        width: min(490px, 95vw);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .turn-text { font-size: 15px; font-weight: 700; }
      .controls { display: flex; gap: 8px; }
      button, select {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #1c2330;
        color: var(--text);
        cursor: pointer;
      }
      button.primary { background: var(--p1); border-color: var(--p1); color: #0b0d11; }
      .board {
        width: min(490px, 95vw);
        background: #18202c;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
      }
      .col-btn {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 4px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 10px;
      }
      .col-btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.04);
        border-color: #2f3a4d;
      }
      .slot {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background: #0b0e14;
        border: 1px solid #263040;
        transition: transform 140ms ease, background-color 140ms ease;
      }
      .slot.p1 { background: var(--p1); border-color: #fb923c; }
      .slot.p2 { background: var(--p2); border-color: #ffffff; }
      .slot.win { box-shadow: 0 0 0 3px #10b981; }
      .scoreboard {
        width: min(490px, 95vw);
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="turn-text" id="turn-el">Amber's Turn</div>
      <div class="controls">
        <select id="mode-select" aria-label="Game mode">
          <option value="bot">vs Computer</option>
          <option value="local">2 Players</option>
        </select>
        <button type="button" class="primary" id="reset-btn">New Round</button>
      </div>
    </div>

    <div class="board" id="board" role="grid" aria-label="Four in a Row board"></div>

    <div class="scoreboard">
      <span id="p1-score">Amber Wins: 0</span>
      <span>Click a column or press keys 1–7</span>
      <span id="p2-score">Ivory Wins: 0</span>
    </div>

    <script>
      const ROWS = 6;
      const COLS = 7;
      const boardEl = document.getElementById('board');
      const turnEl = document.getElementById('turn-el');
      const modeSelect = document.getElementById('mode-select');
      const resetBtn = document.getElementById('reset-btn');
      const p1ScoreEl = document.getElementById('p1-score');
      const p2ScoreEl = document.getElementById('p2-score');

      let grid = [];
      let turn = 1;
      let over = false;
      let winCells = new Set();
      let wins = { 1: 0, 2: 0 };
      let botTimer = null;

      function resetRound() {
        clearTimeout(botTimer);
        grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        turn = 1;
        over = false;
        winCells = new Set();
        updateTurnLabel();
        render();
      }

      function updateTurnLabel(winner = 0, draw = false) {
        if (draw) {
          turnEl.textContent = 'Draw — Board Full';
          return;
        }
        if (winner) {
          const name = winner === 1 ? 'Amber' : modeSelect.value === 'bot' ? 'Computer (Ivory)' : 'Ivory';
          turnEl.textContent = `${name} Wins!`;
          return;
        }
        const name = turn === 1 ? 'Amber' : modeSelect.value === 'bot' ? 'Computer (Ivory)' : 'Ivory';
        turnEl.textContent = `${name}'s Turn`;
      }

      function getDropRow(col) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r][col] === 0) return r;
        }
        return -1;
      }

      function checkWin(player) {
        const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (grid[r][c] !== player) continue;
            for (const [dr, dc] of dirs) {
              const line = [[r, c]];
              for (let k = 1; k < 4; k++) {
                const nr = r + dr * k, nc = c + dc * k;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === player) {
                  line.push([nr, nc]);
                } else break;
              }
              if (line.length === 4) return line;
            }
          }
        }
        return null;
      }

      function dropDisc(col) {
        if (over) return;
        const r = getDropRow(col);
        if (r === -1) return;

        grid[r][col] = turn;
        const winLine = checkWin(turn);
        if (winLine) {
          over = true;
          winLine.forEach(([wr, wc]) => winCells.add(`${wr},${wc}`));
          wins[turn] += 1;
          p1ScoreEl.textContent = `Amber Wins: ${wins[1]}`;
          p2ScoreEl.textContent = `${modeSelect.value === 'bot' ? 'Computer' : 'Ivory'} Wins: ${wins[2]}`;
          updateTurnLabel(turn, false);
          render();
          return;
        }

        if (grid[0].every((v) => v !== 0)) {
          over = true;
          updateTurnLabel(0, true);
          render();
          return;
        }

        turn = turn === 1 ? 2 : 1;
        updateTurnLabel();
        render();

        if (!over && turn === 2 && modeSelect.value === 'bot') {
          botTimer = setTimeout(() => {
            const botCol = chooseBotColumn();
            if (botCol !== -1) dropDisc(botCol);
          }, 450);
        }
      }

      function chooseBotColumn() {
        const valid = [];
        for (let c = 0; c < COLS; c++) {
          if (getDropRow(c) !== -1) valid.push(c);
        }
        if (!valid.length) return -1;

        // 1. Immediate winning move
        for (const c of valid) {
          const r = getDropRow(c);
          grid[r][c] = 2;
          const winsNow = !!checkWin(2);
          grid[r][c] = 0;
          if (winsNow) return c;
        }

        // 2. Block player's immediate winning move
        for (const c of valid) {
          const r = getDropRow(c);
          grid[r][c] = 1;
          const blocksThreat = !!checkWin(1);
          grid[r][c] = 0;
          if (blocksThreat) return c;
        }

        // 3. Prefer center columns while avoiding giving opponent an immediate win above
        const order = [3, 2, 4, 1, 5, 0, 6].filter((c) => valid.includes(c));
        for (const c of order) {
          const r = getDropRow(c);
          grid[r][c] = 2;
          let unsafe = false;
          if (r - 1 >= 0) {
            grid[r - 1][c] = 1;
            if (checkWin(1)) unsafe = true;
            grid[r - 1][c] = 0;
          }
          grid[r][c] = 0;
          if (!unsafe) return c;
        }
        return order[0];
      }

      function render() {
        boardEl.innerHTML = '';
        for (let c = 0; c < COLS; c++) {
          const colBtn = document.createElement('button');
          colBtn.type = 'button';
          colBtn.className = 'col-btn';
          colBtn.disabled = over || getDropRow(c) === -1 || (turn === 2 && modeSelect.value === 'bot');
          colBtn.setAttribute('aria-label', `Drop disc in column ${c + 1}`);
          colBtn.addEventListener('click', () => dropDisc(c));

          for (let r = 0; r < ROWS; r++) {
            const slot = document.createElement('span');
            const val = grid[r][c];
            slot.className = 'slot';
            if (val === 1) slot.classList.add('p1');
            if (val === 2) slot.classList.add('p2');
            if (winCells.has(`${r},${c}`)) slot.classList.add('win');
            colBtn.appendChild(slot);
          }
          boardEl.appendChild(colBtn);
        }
      }

      document.addEventListener('keydown', (e) => {
        const col = Number(e.key) - 1;
        if (col >= 0 && col < COLS) {
          if (!(turn === 2 && modeSelect.value === 'bot')) dropDisc(col);
        }
      });

      modeSelect.addEventListener('change', () => {
        wins = { 1: 0, 2: 0 };
        p1ScoreEl.textContent = 'Amber Wins: 0';
        p2ScoreEl.textContent = `${modeSelect.value === 'bot' ? 'Computer' : 'Ivory'} Wins: 0`;
        resetRound();
      });
      resetBtn.addEventListener('click', resetRound);

      resetRound();
    </script>
  </body>
</html>
